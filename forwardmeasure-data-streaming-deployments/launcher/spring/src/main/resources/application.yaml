datastreaming:
  launcher:
    k8s:
      namespaces: ""
      images: ""
      image-pull-secrets: ""
      host-aliases: ""
    pekko:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka-streams:
      image: ""
      command: "java -jar /deployments/application.jar"
    # The Spark compute-stage Job dispatched ahead of a delivery Job when a plan's ExecutionPlan
    # carries a sparkStage (see DirectIngestionLauncher's own javadoc) - empty (no Spark stage ever
    # dispatchable) unless a real HEAVY transform exists that needs one.
    spark:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka:
      bootstrap-servers: ""
    fowf:
      base-url: "http://localhost:8080"
      keycloak:
        token-url: "http://localhost:8081/realms/forwardmeasure/protocol/openid-connect/token"
        client-id: ""
        client-secret: ""
    # Real, fail-closed caller authentication/authorization, added 2026-09-14 to close a confirmed
    # gap (see docs/fds-authorization-remediation-guide.md) - mirrors
    # forwardmeasure-entity-intelligence's own real SpringAuthorizationBinding wiring.
    authorization:
      organization-client-id: ${DATASTREAMING_ORGANIZATION_CLIENT_ID:forwardmeasure-public}
      issuer: ${DATASTREAMING_KEYCLOAK_ISSUER:http://localhost:8080/realms/datastreaming}
      client-id: ${DATASTREAMING_AUTHORIZATION_CLIENT_ID:datastreaming}
      client-secret: ${DATASTREAMING_AUTHORIZATION_CLIENT_SECRET:}
      request-timeout: 5S
      decision-ttl: 5S
      maximum-cache-entries: 10000
      policy-version: v1

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DATASTREAMING_KEYCLOAK_ISSUER:http://localhost:8080/realms/datastreaming}
# Health only over HTTP (Spring Boot's own default, stated as fowf's Spring services do).
management:
  endpoints:
    web:
      exposure:
        include: health
