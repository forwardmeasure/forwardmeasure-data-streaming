micronaut:
  serde:
    serialization:
      # Every field written, nulls and empty collections included - Jackson's default on Quarkus and
      # Spring. Serde's own default, NON_EMPTY, omits both (e.g. a problem's empty violations).
      inclusion: ALWAYS
  security:
    enabled: true
    # A request that matches no route is a 404, as on Quarkus and Spring - not Micronaut security's
    # own 403 for an authenticated caller.
    reject-not-found: false
    authentication: bearer
    token:
      jwt:
        claims-validators:
          issuer: "${DATASTREAMING_KEYCLOAK_ISSUER:datastreaming.launcher.authorization.issuer:}"
        signatures:
          jwks:
            keycloak:
              url: ${DATASTREAMING_KEYCLOAK_ISSUER:`http://localhost:8080/realms/datastreaming`}/protocol/openid-connect/certs
    # SecuredAnnotationRule never fires for a route registered through micronaut-jaxrs-server's
    # bridge - every JAX-RS-bridged resource in this leaf needs an explicit rule here, mirrors
    # forwardmeasure-entity-intelligence's own real resolution-service-micronaut application.yml
    # exactly. Added 2026-09-14 to close a confirmed gap - see
    # docs/fds-authorization-remediation-guide.md.
    intercept-url-map:
      - pattern: /ingestion-runs
        access:
          - isAuthenticated()
      - pattern: /ingestion-runs/**
        access:
          - isAuthenticated()
      - pattern: /workflow-runs
        access:
          - isAuthenticated()
      - pattern: /workflow-runs/**
        access:
          - isAuthenticated()
      # Health open (kubelet's probes send no token). Every other path, an unknown one too, needs a
      # verified token - Spring's anyRequest().authenticated(), Quarkus's /* policy. First match wins,
      # so these stay last.
      - pattern: "/health"
        access:
          - isAnonymous()
      - pattern: "/health/**"
        access:
          - isAnonymous()
      - pattern: "/**"
        access:
          - isAuthenticated()

datastreaming:
  launcher:
    k8s:
      namespaces: ""
      images: ""
      image-pull-secrets: ""
      host-aliases: ""
    pekko:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka-streams:
      image: ""
      command: "java -jar /deployments/application.jar"
    # The Spark compute-stage Job dispatched ahead of a delivery Job when a plan's ExecutionPlan
    # carries a sparkStage (see DirectIngestionLauncher's own javadoc) - empty (no Spark stage ever
    # dispatchable) unless a real HEAVY transform exists that needs one.
    spark:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka:
      bootstrap-servers: ""
    fowf:
      base-url: "http://localhost:8080"
      keycloak:
        token-url: "http://localhost:8081/realms/forwardmeasure/protocol/openid-connect/token"
        client-id: ""
        client-secret: ""
    authorization:
      organization-client-id: ${DATASTREAMING_ORGANIZATION_CLIENT_ID:forwardmeasure-public}
      issuer: ${DATASTREAMING_KEYCLOAK_ISSUER:`http://localhost:8080/realms/datastreaming`}
      client-id: ${DATASTREAMING_AUTHORIZATION_CLIENT_ID:datastreaming}
      client-secret: ${DATASTREAMING_AUTHORIZATION_CLIENT_SECRET:}
      # Real config gap found and fixed 2026-09-23, building this module's first-ever real boot
      # test: Micronaut's own Duration converter rejects "5S" ("Unparseable date format (5S).
      # Should either be a ISO-8601 duration or a round number followed by the unit type") - unlike
      # Quarkus/Spring's own more lenient duration parsers, which accept it as shorthand. ISO-8601
      # (PT5S) is the one format all three frameworks' Duration converters accept.
      request-timeout: PT5S
      decision-ttl: PT5S
      maximum-cache-entries: 10000
      policy-version: v1
# Health only: /health/liveness and /health/readiness, the java-microservice chart's Micronaut probe
# paths (micronaut-management). HealthEndpoint isn't sensitive, so micronaut-security lets kubelet's
# token-less probes through without an intercept-url-map rule. Every other built-in endpoint (beans,
# routes, threaddump, refresh, ...) is off - Spring and Quarkus expose only health over HTTP.
endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false
