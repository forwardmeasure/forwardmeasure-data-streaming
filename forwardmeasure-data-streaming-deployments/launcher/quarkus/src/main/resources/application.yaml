datastreaming:
  launcher:
    k8s:
      namespaces: ""
      images: ""
      image-pull-secrets: ""
      # Real Kubernetes pod.spec.hostAliases entries ("hostname=ip,hostname2=ip2") - empty in
      # every real deployment; only a test environment whose dispatch target (a
      # Testcontainers-managed K3s node) can't resolve a sibling Testcontainers-managed service
      # through cluster DNS needs this at all (see KubernetesJobSpec's own javadoc in fowf).
      host-aliases: ""
    pekko:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka-streams:
      image: ""
      command: "java -jar /deployments/application.jar"
    # The Spark compute-stage Job dispatched ahead of a delivery Job when a plan's ExecutionPlan
    # carries a sparkStage (see DirectIngestionLauncher's own javadoc) - empty (no Spark stage ever
    # dispatchable) unless a real HEAVY transform exists that needs one.
    spark:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka:
      bootstrap-servers: ""
    fowf:
      base-url: "http://localhost:8080"
      keycloak:
        token-url: "http://localhost:8081/realms/forwardmeasure/protocol/openid-connect/token"
        client-id: ""
        client-secret: ""
    # Real, fail-closed caller authentication/authorization, added 2026-09-14 to close a confirmed
    # gap (see docs/fds-authorization-remediation-guide.md) - mirrors
    # forwardmeasure-entity-intelligence's own quarkus deployment leaf exactly.
    authorization:
      organization-client-id: ${DATASTREAMING_ORGANIZATION_CLIENT_ID:forwardmeasure-public}
      issuer: ${DATASTREAMING_KEYCLOAK_ISSUER:http://localhost:8080/realms/datastreaming}
      client-id: ${DATASTREAMING_AUTHORIZATION_CLIENT_ID:datastreaming}
      client-secret: ${DATASTREAMING_AUTHORIZATION_CLIENT_SECRET:}
      request-timeout: 5S
      decision-ttl: 5S
      maximum-cache-entries: 10000
      policy-version: v1

quarkus:
  http:
    auth:
      # Authenticated by default, like the Spring launcher's anyRequest().authenticated() and the
      # Micronaut launcher's intercept-url-map: quarkus-oidc alone verifies a presented token but never
      # requires one, so an anonymous request reached the resources. Quarkus applies the most specific
      # matching path, so health (kubelet's probes send no token) stays open.
      # forwardmeasure-platform-quarkus-security's ProblemChallengeMechanism writes every 401 as the
      # RFC 9457 problem Spring and Micronaut return.
      permission:
        health:
          paths: /q/*
          policy: permit
        authenticated:
          paths: /*
          policy: authenticated
  oidc:
    auth-server-url: ${DATASTREAMING_KEYCLOAK_ISSUER:http://localhost:8080/realms/datastreaming}
    application-type: service
