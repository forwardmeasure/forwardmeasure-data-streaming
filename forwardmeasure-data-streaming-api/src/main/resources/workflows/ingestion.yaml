document:
  dsl: '1.0.3'
  namespace: data-streaming
  name: ingestion
  version: '1.1.0'
  title: Planned data ingestion
input:
  schema:
    document:
      type: object
      required: [namespace, primary, continuous, hasDelivery, deploymentName]
      properties:
        namespace: {type: string}
        primary: {type: object}
        delivery: {type: object}
        continuous: {type: boolean}
        hasDelivery: {type: boolean}
        deploymentName: {type: string}
do:
  - runPrimary:
      if: '${ $workflow.input.continuous == false }'
      call: com.forwardmeasure.openworkflow.correlated-worker
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-job.yaml'
        command:
          channel: ingestion.commands
          message:
            payload: '${ $workflow.input.primary }'
        events:
          channel: ingestion.events
          subscription:
            namespace: '${ $workflow.input.namespace }'
            consume:
              until: '${ .payload.status == "SUCCEEDED" or .payload.status == "FAILED" or .payload.status == "CANCELLED" }'
              for: PT24H
        cancellation:
          channel: ingestion.cancellations
          message:
            payload:
              namespace: '${ $workflow.input.namespace }'
  - runDelivery:
      if: '${ $workflow.input.hasDelivery and ($workflow.input.continuous == false) }'
      call: com.forwardmeasure.openworkflow.correlated-worker
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-job.yaml'
        command:
          channel: ingestion.commands
          message:
            payload: '${ $workflow.input.delivery }'
        events:
          channel: ingestion.events
          subscription:
            namespace: '${ $workflow.input.namespace }'
            consume:
              until: '${ .payload.status == "SUCCEEDED" or .payload.status == "FAILED" or .payload.status == "CANCELLED" }'
              for: PT24H
        cancellation:
          channel: ingestion.cancellations
          message:
            payload:
              namespace: '${ $workflow.input.namespace }'
  - applyContinuousWorker:
      if: '${ $workflow.input.continuous }'
      call: asyncapi
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-deployment.yaml'
        channel: ingestion.commands
        message:
          payload: '${ $workflow.input.primary }'
  - awaitContinuousReadiness:
      if: '${ $workflow.input.continuous }'
      call: asyncapi
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-deployment.yaml'
        channel: ingestion.events
        subscription:
          consume:
            amount: 1
          filter: '${ {namespace: $workflow.input.namespace, name: $workflow.input.deploymentName, readinessTimeoutSeconds: 600} }'
  - applyContinuousDelivery:
      if: '${ $workflow.input.continuous and $workflow.input.hasDelivery }'
      call: asyncapi
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-deployment.yaml'
        channel: ingestion.commands
        message:
          payload: '${ $workflow.input.delivery }'
  - awaitContinuousDeliveryReadiness:
      if: '${ $workflow.input.continuous and $workflow.input.hasDelivery }'
      call: asyncapi
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-deployment.yaml'
        channel: ingestion.events
        subscription:
          consume:
            amount: 1
          filter: '${ {namespace: $workflow.input.namespace, name: $workflow.input.delivery.name, readinessTimeoutSeconds: 600} }'
output:
  as: '${ {namespace: $workflow.input.namespace, deploymentName: $workflow.input.deploymentName, continuous: $workflow.input.continuous, hasDelivery: $workflow.input.hasDelivery} }'
