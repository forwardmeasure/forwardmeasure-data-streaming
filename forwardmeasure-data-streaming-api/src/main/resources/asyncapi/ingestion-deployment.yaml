asyncapi: 2.6.0
info:
  title: Planned ingestion worker
  version: 1.1.0
servers:
  cluster:
    url: k8s://in-cluster
    protocol: kubernetes-deployment
channels:
  ingestion.commands:
    servers: [cluster]
    publish:
      message:
        name: LaunchIngestion
        payload:
          type: object
          required: [namespace, name]
          properties:
            action: {type: string, enum: [apply, delete]}
            name: {type: string}
            namespace: {type: string}
            image: {type: string}
  ingestion.events:
    servers: [cluster]
    subscribe:
      message:
        name: IngestionStatus
