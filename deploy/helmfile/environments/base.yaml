# The namespace (data-streaming), shared endpoints, identity client, image-pull Secret and the
# kafka-streams executor image (also launched by forwardmeasure-entity-intelligence) come from
# forwardmeasure-platform/deploy/helmfile/shared/, loaded last by helmfile.yaml.gotmpl.

imagePullPolicy: IfNotPresent
# The ServiceAccount fowf runs continuous workers as (helmfiles/launcher.yaml.gotmpl creates it;
# forwardmeasure-openworkflow allowlists it for this product's tenants' Deployments).
workerServiceAccountName: data-streaming-worker
# Real, sha256-pinned executor images - org policy requires a pinned digest, not a floating tag
# (AsyncApiKubernetesJobOperationExecutor's own real check). Digests below are current as of
# 2026-09-26 (rebuilt/repushed the same day the stale-digest "unknown named transform" bug for
# Customer Master was found and fixed) - see forwardmeasure-data-streaming's own session history,
# not hardcoded on a whim.
#
# Named imageVersions (was executorImages until 2026-09-29) and carrying a tag, so
# forwardmeasure-platform's install-platform.sh -> sync-image-digests.sh re-resolves each pinned
# digest against the registry on every install - that script only walks .imageVersions entries
# that have both a tag and an already-pinned digest.
imageVersions:
  # The launcher service - one image per framework; the release runs forwardmeasure-platform's
  # platform.framework. Empty digests fall back to the tag until each image is pushed and pinned.
  launcher:
    repositories:
      quarkus: forwardmeasure/data-streaming-launcher-quarkus
      spring: forwardmeasure/data-streaming-launcher-spring
      micronaut: forwardmeasure/data-streaming-launcher-micronaut
    tag: "1.1.0"
    digests:
      quarkus: "sha256:48b761077aa34721239f846fdbfa6ed8a095dfddcde38da059231a013569145d"
      spring: ""
      micronaut: ""
  pekko:
    repository: docker.io/forwardmeasure/data-streaming-executor-pekko
    tag: "1.1.0"
    digest: "sha256:a960f6a1cf5d56dbb0f4a8f5f85452281f5f31e1d1eb637c787051896764f810"
  # Kafka Streams installations only: the bounded-load first stage (forwardmeasure-data-streaming-loader).
  loader:
    repository: docker.io/forwardmeasure/data-streaming-loader
    tag: "1.1.0"
    digest: "sha256:34ae9117d7d6d3cd84b8126ec3cfceb32869e2000c99986b15703811bd0f9f90"
  spark:
    repository: docker.io/forwardmeasure/data-streaming-executor-spark
    tag: "1.1.0"
    digest: "sha256:4d6764c4d62a5808fb2f1631352336caaa6cd5c5330225b16c3ef3516c08911c"
