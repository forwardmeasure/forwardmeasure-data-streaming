openapi: 3.0.3
info:
  title: ForwardMeasure Data Streaming Launcher
  version: 1.1.0
security:
  - bearerAuth: []
paths:
  /ingestion-runs:
    post:
      tags: [IngestionRuns]
      operationId: createIngestionRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DirectLaunchRequest'}
      responses:
        '202':
          description: Run accepted
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAccepted'}
        default: {$ref: '#/components/responses/Problem'}
  /ingestion-runs/{correlationId}:
    get:
      tags: [IngestionRuns]
      operationId: getIngestionRun
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Namespace'}
      responses:
        '200': {description: Current Kubernetes run observation, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Problem'}
  /ingestion-runs/{correlationId}/cancel:
    post:
      tags: [IngestionRuns]
      operationId: cancelIngestionRun
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Namespace'}
      responses:
        '204': {description: Cancellation requested}
        default: {$ref: '#/components/responses/Problem'}
  /workflow-runs:
    post:
      tags: [WorkflowRuns]
      operationId: createWorkflowRun
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowLaunchRequest'}
      responses:
        '202': {description: Workflow execution admitted, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workflow-runs/{executionId}:
    get:
      tags: [WorkflowRuns]
      operationId: getWorkflowRun
      parameters:
        - {$ref: '#/components/parameters/ExecutionId'}
      responses:
        '200': {description: Current workflow execution, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workflow-runs/{executionId}/cancel:
    post:
      tags: [WorkflowRuns]
      operationId: cancelWorkflowRun
      parameters:
        - {$ref: '#/components/parameters/ExecutionId'}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: correlationId, in: query, required: true, schema: {type: string}}
        - {name: reason, in: query, schema: {type: string}}
      responses:
        '200': {description: Cancellation requested, content: {application/json: {schema: {type: object}}}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    CorrelationId: {name: correlationId, in: path, required: true, schema: {type: string, minLength: 1}}
    Namespace: {name: namespace, in: query, required: true, schema: {type: string, minLength: 1}}
    ExecutionId: {name: executionId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    IngestionSpec:
      type: object
      description: Shared IngestionSpec contract in ingestion-spec.yaml; identical in direct and planned workflow modes.
    DirectLaunchRequest:
      type: object
      required: [correlationId, namespace, ingestionSpec]
      properties:
        correlationId: {type: string, minLength: 1}
        namespace: {type: string, minLength: 1}
        ingestionSpec: {$ref: '#/components/schemas/IngestionSpec'}
        resourceRequests: {type: object, additionalProperties: {type: string}}
        resourceLimits: {type: object, additionalProperties: {type: string}}
        activeDeadlineSeconds: {type: integer, format: int64, minimum: 1}
    WorkflowLaunchRequest:
      type: object
      required: [revisionId, idempotencyKey, correlationId]
      oneOf:
        - required: [input]
        - required: [ingestion]
      properties:
        revisionId: {type: string, format: uuid}
        input: {type: object, additionalProperties: true}
        ingestion:
          $ref: '#/components/schemas/DirectLaunchRequest'
        idempotencyKey: {type: string, minLength: 1}
        correlationId: {type: string, minLength: 1}
    RunAccepted:
      type: object
      required: [correlationId, jobName]
      properties:
        correlationId: {type: string}
        jobName: {type: string}
    # BEGIN GENERATED platform problem-v1: Problem
    Problem: {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "type",
        "title",
        "status"
      ],
      "properties": {
        "type": {
          "type": "string",
          "format": "uri-reference",
          "default": "about:blank"
        },
        "title": {
          "type": "string"
        },
        "status": {
          "type": "integer",
          "format": "int32",
          "minimum": 100,
          "maximum": 599
        },
        "detail": {
          "type": "string",
          "nullable": true
        },
        "instance": {
          "type": "string",
          "format": "uri-reference",
          "nullable": true
        },
        "correlation_id": {
          "type": "string",
          "nullable": true
        },
        "violations": {
          "type": "array",
          "items": {
            "$ref": "#/components/schemas/Violation"
          },
          "default": [],
          "nullable": true
        }
      }
    }
    # END GENERATED platform problem-v1: Problem
    # BEGIN GENERATED platform problem-v1: Violation
    Violation: {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "field",
        "message"
      ],
      "properties": {
        "field": {
          "type": "string"
        },
        "message": {
          "type": "string"
        },
        "rejected_value": {
          "type": "string",
          "nullable": true
        }
      }
    }
    # END GENERATED platform problem-v1: Violation
