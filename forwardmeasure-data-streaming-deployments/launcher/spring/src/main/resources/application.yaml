datastreaming:
  launcher:
    k8s:
      namespaces: ""
      images: ""
      image-pull-secrets: ""
      host-aliases: ""
    # The installation's one delivery engine: the platform engine setting
    # (kafka-streams | pekko-postgresql | pekko-cassandra). Required, no default - the launcher
    # never picks an engine. Only that engine's runner below is used.
    # engine: <set by the deployment>
    pekko:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka-streams:
      image: ""
      command: "java -jar /deployments/application.jar"
    # Kafka Streams installations only: the bounded-load first stage that writes file, text and
    # SQL source rows to a per-run topic for the Kafka Streams delivery Job.
    loader:
      image: ""
      command: "java -jar /deployments/application.jar"
    # The Spark compute-stage Job dispatched ahead of a delivery Job when a plan carries a
    # sparkStage (a HEAVY transform). Required on every installation, like kafka.bootstrap-servers.
    spark:
      image: ""
      command: "java -jar /deployments/application.jar"
    kafka:
      bootstrap-servers: ""
    # Pekko installations: where continuous workers keep their state (the installation's
    # journal) - plain settings as NAME=value;... and Secret-sourced ones as NAME=secret/key;...
    journal:
      env: ""
      secret-env: ""
      # GCP: a Cloud SQL Auth Proxy sidecar beside each continuous worker (image, the
      # instance-name Secret as name/key, and the ServiceAccount whose Workload Identity
      # authorizes it); empty elsewhere.
      database-proxy:
        image: ""
        instance-secret: ""
        service-account: ""
    fowf:
      base-url: "http://localhost:8080"
      keycloak:
        token-url: "http://localhost:8081/realms/forwardmeasure/protocol/openid-connect/token"
        client-id: ""
        client-secret: ""
    # Real, fail-closed caller authentication/authorization, added 2026-09-14 to close a confirmed
    # gap (see docs/fds-authorization-remediation-guide.md) - mirrors
    # forwardmeasure-entity-intelligence's own real SpringAuthorizationBinding wiring.
    authorization:
      organization-client-id: ${DATASTREAMING_ORGANIZATION_CLIENT_ID:forwardmeasure-public}
      issuer: ${DATASTREAMING_KEYCLOAK_ISSUER:http://localhost:8080/realms/datastreaming}
      client-id: ${DATASTREAMING_AUTHORIZATION_CLIENT_ID:datastreaming}
      client-secret: ${DATASTREAMING_AUTHORIZATION_CLIENT_SECRET:}
      request-timeout: 5S
      decision-ttl: 5S
      maximum-cache-entries: 10000
      policy-version: v1

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${DATASTREAMING_KEYCLOAK_ISSUER:http://localhost:8080/realms/datastreaming}
# Health only over HTTP (Spring Boot's own default, stated as fowf's Spring services do).
management:
  endpoints:
    web:
      exposure:
        include: health
