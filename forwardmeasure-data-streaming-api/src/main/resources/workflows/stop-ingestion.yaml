document:
  dsl: '1.0.3'
  namespace: data-streaming
  name: stop-ingestion
  version: '1.1.0'
  title: Stop continuous ingestion workers
input:
  schema:
    document:
      type: object
      required: [namespace, deploymentName]
      properties:
        namespace: {type: string}
        deploymentName: {type: string}
do:
  - stopCompute:
      call: asyncapi
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-deployment.yaml'
        channel: ingestion.commands
        message:
          payload: '${ {action: "delete", namespace: $workflow.input.namespace, name: $workflow.input.deploymentName} }'
  - stopDelivery:
      call: asyncapi
      with:
        document:
          endpoint: '@BUNDLE_DID@/ingestion-deployment.yaml'
        channel: ingestion.commands
        message:
          payload: '${ {action: "delete", namespace: $workflow.input.namespace, name: ($workflow.input.deploymentName + "-delivery")} }'
